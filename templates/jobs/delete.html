{% extends "base.html" %}
{% block title %}Delete Application - Job Tracker{% endblock %}

{% block content %}
<div class="card shadow-sm border-danger">
    <div class="card-body">
        <h2 class="fw-bold text-danger mb-3">Confirm Delete</h2>
        <p>Are you sure you want to delete the application for
            <strong>{{ job.position }}</strong> at <strong>{{ job.company_name }}</strong>?
            This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'job_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
